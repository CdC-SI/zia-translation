spring.application.name=zia-translation
server.servlet.context-path=/zia-trad
spring.servlet.multipart.max-file-size=${ZIA_TRANSLATION_PDF_MAX_FILE_SIZE:50MB}
spring.servlet.multipart.max-request-size=${ZIA_TRANSLATION_PDF_MAX_FILE_SIZE:50MB}

# --- Stratégie de traduction : single (vision) | dual (vision + llm) ---
zia.translation.strategy=${ZIA_TRANSLATION_STRATEGY:dual}

# --- Langue cible par d\u00e9faut (fr | de | it | en), utilis\u00e9e si la langue demand\u00e9e est absente ou non support\u00e9e ---
zia.translation.default-language=${ZIA_TRANSLATION_DEFAULT_LANGUAGE:fr}

# --- API Key pour appeler les services IA
zia.internal.api-key=${ZIA_INTERNAL_API_KEY:none}

# --- Modèle Vision interne (OCR + traduction si stratégie single) ---
zia.internal.vision.model=${ZIA_VISION_MODEL}
zia.internal.vision.base-url=${ZIA_VISION_BASE_URL}
# Plafond de tokens générés par requête (raisonnement + réponse) : coupe une génération qui boucle
zia.internal.vision.max-tokens=${ZIA_VISION_MAX_TOKENS:8192}

# --- Modèle LLM textuel interne (traduction si stratégie dual) ---
zia.internal.llm.model=${ZIA_LLM_MODEL}
zia.internal.llm.base-url=${ZIA_LLM_BASE_URL}
zia.internal.llm.max-tokens=${ZIA_LLM_MAX_TOKENS:8192}

# --- Acronym glossary offered to the model as the lookup_acronyms tool (all endpoints) ---
zia.translation.glossary.tool-enabled=${ZIA_GLOSSARY_TOOL_ENABLED:true}
zia.translation.glossary.path=${ZIA_GLOSSARY_PATH:classpath:glossary/glossary_2026-10-20.json}
# Appels à lookup_acronyms permis par requête ; au-delà, le modèle reçoit un message d'erreur et termine sa traduction
zia.translation.glossary.max-tool-calls=${ZIA_GLOSSARY_MAX_TOOL_CALLS:2}

# --- Preprocessing des images avant envoi au modèle vision ---
zia.translation.vision.preprocessing.max-edge=${ZIA_VISION_PREPROCESSING_MAX_EDGE:1024}
zia.translation.vision.preprocessing.jpeg-quality=${ZIA_VISION_PREPROCESSING_JPEG_QUALITY:0.75}

# --- PDF ---
zia.translation.pdf.max-file-size=${ZIA_TRANSLATION_PDF_MAX_FILE_SIZE:50MB}
zia.translation.pdf.font-path=${FONT_PATH:fonts/Arial.ttf}
# --- Footer IA ajout\u00e9 en bas de chaque page des PDF traduits (une valeur par langue cible, vide = pas de footer) ---
zia.translation.pdf.footer.fr=${ZIA_PDF_FOOTER_FR:Ce document a \u00e9t\u00e9 traduit par une intelligence artificielle (IA) et peut contenir des erreurs.}
zia.translation.pdf.footer.de=${ZIA_PDF_FOOTER_DE:Dieses Dokument wurde mit k\u00fcnstlicher Intelligenz (KI) \u00fcbersetzt und kann Fehler enthalten.}
zia.translation.pdf.footer.it=${ZIA_PDF_FOOTER_IT:Questo documento \u00e8 stato tradotto con l'intelligenza artificiale (IA) e pu\u00f2 contenere errori.}
zia.translation.pdf.footer.en=${ZIA_PDF_FOOTER_EN:This document was translated by artificial intelligence (AI) and may contain errors.}
zia.translation.pdf.storage-path=${ZIA_PDF_STORAGE_PATH:/translations}
zia.translation.md.storage-path=${ZIA_MD_STORAGE_PATH:/translations}
zia.translation.pdf.job-ttl=${ZIA_TRANSLATION_PDF_JOB_TTL:1h}
zia.translation.pdf.cleanup-interval=${ZIA_TRANSLATION_PDF_CLEANUP_INTERVAL:10m}
zia.translation.async.pool-size=${ZIA_TRANSLATION_ASYNC_POOL_SIZE:4}

# --- Plain text translation ---
zia.translation.text.max-length=${ZIA_TRANSLATION_TEXT_MAX_LENGTH:20000}

# --- Log global de l'appelant (username du principal + authorities) ---
zia.logging.caller.enabled=${ZIA_LOGGING_CALLER_ENABLED:false}

# --- Groupes RHDS autorisés à appeler l'API (DN complets séparés par ';'). Vide = tout est refusé ---
zia.security.translator-groups=${ZIA_SECURITY_TRANSLATOR_GROUPS:}

# --- Disable incompatible Spring AI OpenAI auto-configuration ---
spring.autoconfigure.exclude=\
  org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration,\
  org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration,\
  org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration,\
  org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration,\
  org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration,\
  org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration

zas.security.blue-token.public-key=${GATEWAY_PUBLIC_KEY}
zas.security.blue-token.header-name=Blue
