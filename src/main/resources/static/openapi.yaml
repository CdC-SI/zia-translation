openapi: 3.1.0
info:
  title: ZIA Translation Service
  description: >
    Service de traduction de documents. Accepte un fichier PDF en entrée,
    en extrait le texte via OCR (modèle vision), et le traduit via un LLM.
    Retourne soit un job PDF asynchrone, soit un flux SSE de pages traduites.
  version: 0.0.1

servers:
  - url: /api/translation
    description: Translation API base path

paths:
  /pdf:
    post:
      summary: Submit an async PDF translation job
      operationId: translateToPdf
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: Source PDF document
                targetLanguage:
                  $ref: '#/components/schemas/TargetLanguage'
                strategy:
                  $ref: '#/components/schemas/TranslationStrategy'
      responses:
        '202':
          description: Translation job accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslationJobResponse'
        '400':
          description: Bad request — missing file, empty file, unsupported format, or unknown strategy value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /pdf/{jobId}/status:
    get:
      summary: Get async PDF translation job status
      operationId: getPdfTranslationJobStatus
      deprecated: true
      description: >
        **Deprecated**: use `GET /jobs/{jobId}/status` instead. Kept for backward
        compatibility; behavior is unchanged.
      parameters:
        - in: path
          name: jobId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Current job status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslationJobResponse'
        '404':
          description: Unknown job identifier

  /pdf/{jobId}:
    get:
      summary: Download translated PDF when async job is complete
      operationId: downloadTranslatedPdf
      deprecated: true
      description: >
        **Deprecated**: use `GET /jobs/{jobId}` instead. Kept for backward
        compatibility; behavior is unchanged.
      parameters:
        - in: path
          name: jobId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Translated PDF document
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '404':
          description: Unknown job identifier
        '409':
          description: Job is not completed yet (PENDING or PROCESSING)
        '410':
          description: Translated PDF file has expired and was cleaned up
        '422':
          description: Job failed during processing

  /md:
    post:
      summary: Submit an async Markdown translation job
      operationId: translateToMarkdown
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: Source document
                targetLanguage:
                  $ref: '#/components/schemas/TargetLanguage'
                strategy:
                  $ref: '#/components/schemas/TranslationStrategy'
      responses:
        '202':
          description: Translation job accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslationJobResponse'
        '400':
          description: Bad request — missing file, empty file, unsupported format, or unknown strategy value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /jobs/{jobId}/status:
    get:
      summary: Get async translation job status (PDF or Markdown)
      operationId: getTranslationJobStatus
      parameters:
        - in: path
          name: jobId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Current job status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslationJobResponse'
        '404':
          description: Unknown job identifier

  /jobs/{jobId}:
    get:
      summary: Download translated file when async job is complete (PDF or Markdown)
      operationId: downloadTranslatedFile
      description: >
        The response `Content-Type` and file extension depend on the job's output
        format: `application/pdf` (`.pdf`) for a PDF job, `text/markdown` (`.md`)
        for a Markdown job.
      parameters:
        - in: path
          name: jobId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Translated file (PDF or Markdown depending on the job's output format)
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            text/markdown:
              schema:
                type: string
        '404':
          description: Unknown job identifier
        '409':
          description: Job is not completed yet (PENDING or PROCESSING)
        '410':
          description: Translated file has expired and was cleaned up
        '422':
          description: Job failed during processing

  /text:
    post:
      summary: Translate a PDF document and stream translated pages as SSE
      operationId: translateToText
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: Source PDF document
                targetLanguage:
                  $ref: '#/components/schemas/TargetLanguage'
                strategy:
                  $ref: '#/components/schemas/TranslationStrategy'
      responses:
        '200':
          description: >
            Server-Sent Events stream. Emits `page` events with TranslationPageEvent payload,
            then a `complete` event with TranslationCompleteEvent payload. Emits `error`
            with a message payload if processing fails mid-stream.
          content:
            text/event-stream:
              schema:
                type: string
              examples:
                pageAndComplete:
                  summary: Example stream sequence
                  value: |
                    event: page
                    data: {"pageNumber":1,"text":"Texte traduit de la page 1..."}

                    event: complete
                    data: {"totalPages":1}
        '400':
          description: Bad request — missing file, empty file, unsupported format, or unknown strategy value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /plain-text:
    post:
      summary: Synchronously translate a plain text (no file, no job, no streaming)
      operationId: translatePlainText
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlainTextTranslationRequest'
      responses:
        '200':
          description: Translated text
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlainTextTranslationResponse'
        '400':
          description: Bad request — missing/unreadable body, missing or empty `text`, or `text` too long
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: Unsupported Content-Type (must be `application/json`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Translation failed on the LLM side
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /invoice-extractions:
    servers:
      - url: /api/v1
        description: Invoice extraction API base path
    post:
      summary: Submit the extraction of the data of a scanned medical invoice (async, OCR / AI)
      operationId: submitInvoiceExtraction
      description: >
        Used by `ole-sumex-invoice-parser` when mandatory values of the `generalInvoiceRequest_500` XML could not be
        found by classic extraction. Contract: `ole-sumex-invoice-parser/src/main/resources/api/ocr-extraction-openapi.yaml`.
        Each page is analysed by the internal vision model, focusing on `context.missingFields`; the value read with
        the highest confidence is kept for each key. Idempotent on `Idempotency-Key`: a known key returns the existing
        job. Jobs are kept `zia.invoice-extraction.job-ttl` (default 24h) after their completion.
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
            maxLength: 128
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, context]
              properties:
                file:
                  type: string
                  format: binary
                  description: The scanned invoice (PDF)
                context:
                  $ref: '#/components/schemas/ExtractionContext'
            encoding:
              file:
                contentType: application/pdf
              context:
                contentType: application/json
      responses:
        '202':
          description: Job created (or existing job for this `Idempotency-Key`)
          headers:
            Location:
              description: URL of the job, relative to the submission URL (`invoice-extractions/{jobId}`)
              schema:
                type: string
            Retry-After:
              description: Seconds to wait before polling the job
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractionJob'
        '400':
          description: Missing/invalid `Idempotency-Key`, `file` or `context`, or document is not a PDF
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Document too large
        '429':
          description: Too many extractions in progress (retry later)

  /invoice-extractions/{jobId}:
    servers:
      - url: /api/v1
        description: Invoice extraction API base path
    get:
      summary: Status of an invoice extraction job and, once finished, its result
      operationId: getInvoiceExtraction
      parameters:
        - in: path
          name: jobId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Status of the job; `Retry-After` is set while it is `PENDING` or `RUNNING`
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractionJob'
        '404':
          description: Unknown or expired job

components:
  schemas:
    TranslationStrategy:
      type: string
      description: >
        Translation strategy to use for this request. If omitted, the global
        configuration (`zia.translation.strategy`) is used as a fallback.
      enum:
        - single
        - dual

    TargetLanguage:
      type: string
      description: >
        Target language. Supported languages: French (`fr`), German (`de`), Italian (`it`)
        and English (`en`). ISO 639-1/639-2 codes, regional variants (e.g. `de-CH`) and common
        language names in fr/de/it/en (e.g. `Deutsch`, `allemand`, `German`) are accepted,
        case- and accent-insensitive. If omitted, blank or unsupported, the default language
        (`zia.translation.default-language`, env `ZIA_TRANSLATION_DEFAULT_LANGUAGE`) is used.
        Generated PDFs include an AI-translation disclaimer footer in the resolved language.
      examples:
        - fr
        - de
        - it
        - en

    TranslationJobResponse:
      type: object
      required:
        - jobId
        - status
      properties:
        jobId:
          type: string
          format: uuid
          description: UUID v4 of the async translation job
        status:
          $ref: '#/components/schemas/JobStatus'

    JobStatus:
      type: string
      enum:
        - PENDING
        - PROCESSING
        - COMPLETED
        - FAILED

    TranslationPageEvent:
      type: object
      required:
        - pageNumber
        - text
      properties:
        pageNumber:
          type: integer
        text:
          type: string

    TranslationCompleteEvent:
      type: object
      required:
        - totalPages
      properties:
        totalPages:
          type: integer

    PlainTextTranslationRequest:
      type: object
      required:
        - text
      properties:
        text:
          type: string
          description: Source plain text to translate
        targetLanguage:
          $ref: '#/components/schemas/TargetLanguage'

    PlainTextTranslationResponse:
      type: object
      required:
        - translatedText
      properties:
        translatedText:
          type: string
          description: The translated plain text

    ErrorResponse:
      type: object
      description: Uniform error response body
      required:
        - status
        - message
        - timestamp
      properties:
        status:
          type: integer
          description: HTTP status code
        message:
          type: string
          description: Human-readable error description
        timestamp:
          type: string
          format: date-time
          description: Time at which the error occurred (ISO-8601)

    ExtractionContext:
      type: object
      properties:
        documentId:
          type: string
        language:
          type: string
          enum: [de, fr, it]
        officeAI:
          type: string
          description: IV office number
        knownFields:
          type: object
          description: Values already extracted (key = field key), used as hints
          additionalProperties:
            type: string
        missingFields:
          type: array
          description: >
            Field keys still missing (`<role>.<field>`, e.g. `biller.gln`, other keys such as `treatment.date_begin`,
            and `services` for the service lines). When empty, every known key and the services are extracted.
          items:
            type: string

    ExtractionJob:
      type: object
      required: [jobId, status]
      properties:
        jobId:
          type: string
        status:
          type: string
          enum: [PENDING, RUNNING, SUCCEEDED, FAILED]
        submittedAt:
          type: string
          format: date-time
        result:
          $ref: '#/components/schemas/ExtractionResponse'
        error:
          type: object
          properties:
            code:
              type: string
              enum: [UNREADABLE_DOCUMENT, EXTRACTION_FAILED, INTERNAL_ERROR]
            message:
              type: string

    ExtractionResponse:
      type: object
      properties:
        documentType:
          type: string
        fields:
          type: object
          additionalProperties:
            type: object
            required: [value]
            properties:
              value:
                type: string
              confidence:
                type: number
                minimum: 0
                maximum: 1
              page:
                type: integer
        services:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
                format: date
              tariffType:
                type: string
              code:
                type: string
              name:
                type: string
              quantity:
                type: number
              unitPrice:
                type: number
              amount:
                type: number
              vatRate:
                type: number
              confidence:
                type: number
        warnings:
          type: array
          items:
            type: string
