spring.application.name=zia-translation-test

zia.translation.strategy=dual
zia.internal.vision.model=test-vision-model
zia.internal.vision.base-url=http://localhost:11434
zia.internal.llm.model=test-llm-model
zia.internal.llm.base-url=http://localhost:11434
zia.internal.api-key=test-api-key
zia.translation.pdf.max-file-size=10MB
zia.translation.pdf.font-path=fonts/Arial.ttf

# --- Disable incompatible Spring AI OpenAI auto-configuration ---
spring.autoconfigure.exclude=\
  org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration,\
  org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration,\
  org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration,\
  org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration,\
  org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration,\
  org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration

zas.security.blue-token.public-key=test

zia.translation.pdf.storage-path=./target/test-pdfs
zia.translation.pdf.job-ttl=1h
zia.translation.pdf.cleanup-interval=10m
zia.translation.async.pool-size=2
